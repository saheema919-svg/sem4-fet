<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Assignment Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

/* Animated Gradient Background */
body{
    background: linear-gradient(135deg, #1e3c72, #2a5298, #6a11cb, #2575fc);
    background-size: 300% 300%;
    animation: gradientMove 10s ease infinite;
    padding: 20px;
    text-align: center;
    color: white;
}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* Heading */
h1{
    margin-bottom: 20px;
    font-size: 2.5rem;
}

/* Sections */
.section{
    margin: 40px 0;
}

.section h2{
    margin-bottom: 20px;
}

/* Grid Layout */
.container{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

/* Glass Cards */
.card{
    background: rgba(255, 255, 255, 0.15);
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.card:hover{
    transform: translateY(-10px) scale(1.05);
    background: rgba(255, 255, 255, 0.25);
}

/* Links */
a{
    text-decoration: none;
    color: white;
    font-weight: bold;
}

.card:hover a{
    color: #ffd369;
}
</style>

</head>

<body>

<h1>✨ My Assignment Hub</h1>

<!-- HTML -->
<div class="section">

    <div class="container">

        <div class="card"><a href="https://saheema919-svg.github.io/sem4-fet/assignments/three.html">Project Gallery</a></div>
        <div class="card"><a href="https://saheema919-svg.github.io/sem4-fet/assignments/four.html">Video</a></div>
        <div class="card"><a href="https://saheema919-svg.github.io/sem4-fet/assignments/five.html">Skills Matrix</a></div>
        <div class="card"><a href="https://saheema919-svg.github.io/sem4-fet/assignments/six.html">Table</a></div>
        <div class="card"><a href="https://saheema919-svg.github.io/sem4-fet/assignments/seven.html">Hire Me</a></div>
    </div>
</div>
