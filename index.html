<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Assignment Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

/* Azure Background */
body{
    background: linear-gradient(135deg, #e0f7ff, #b3e5fc, #81d4fa);
    padding: 20px;
    text-align: center;
    color: #03396c;
}

/* Heading */
h1{
    margin-bottom: 20px;
    font-size: 2.5rem;
}

/* Sections */
.section{
    margin: 40px 0;
}

.section h2{
    margin-bottom: 20px;
}

/* Grid Layout */
.container{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

/* Cards */
.card{
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card:hover{
    transform: translateY(-10px) scale(1.05);
    background: #e1f5fe;
}

/* Links */
a{
    text-decoration: none;
    color: #03396c;
    font-weight: bold;
}

.card:hover a{
    color: #0077b6;
}
</style>

</head>

<body>

<h1>✨ My Assignment Hub</h1>

<!-- HTML -->
<div class="section">
    <h2>📄 HTML Assignments</h2>
    <div class="container">
        <div class="card"><a href="https://saheema919-svg.github.io/sem4-fet/assignments/one.html">Portfolio</a></div>
        <div class="card"><a href="https://saheema919-svg.github.io/sem4-fet/assignments/two.html">Tech Blog</a></div>

        <div class="card"><a href="https://saheema919-svg.github.io/sem4-fet/assignments/four.html">Video</a></div>
        <div class="card"><a href="https://saheema919-svg.github.io/sem4-fet/assignments/five.html">Skills Matrix</a></div>
        <div class="card"><a href="https://saheema919-svg.github.io/sem4-fet/assignments/six.html">Table</a></div>
        <div class="card"><a href="https://saheema919-svg.github.io/sem4-fet/assignments/seven.html">Hire Me</a></div>
    </div>
</div>

<!-- CSS -->

    <h2>🎨 CSS Assignments</h2>
