<html>
<head>
  <title>To Do List</title>

  <style>
    body {
      background: linear-gradient(135deg, #e0f7ff, #b3e5fc, #81d4fa);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Main Box */
    .container {
      background: white;
      padding: 80px;
      width: 400px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      padding: 8px;
      width: 65%;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #0288d1;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0277bd;
    }

    ul {
      padding: 0;
      margin-top: 20px;
    }

    li {
      list-style: none;
      background: #f5f5f5;
      margin: 10px 0;
      padding: 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .done {
      text-decoration: line-through;
      color: gray;
    }

    .delete-btn {
      background: red;
      padding: 5px 8px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>To Do List</h2>

    <input type="text" id="task" placeholder="Enter task">
    <button onclick="addTask()">Add</button>

    <ul id="list"></ul>
  </div>

  <script>
    function addTask() {

      let task = document.getElementById("task").value.trim();

      if (task === "") {
        alert("Enter a task");
        return;
      }

      let li = document.createElement("li");

      li.innerHTML = `
        <div>
          <input type="checkbox" onchange="markDone(this)">
          <span>${task}</span>
        </div>

        <button class="delete-btn" onclick="deleteTask(this)">
          Delete
        </button>
      `;

      document.getElementById("list").appendChild(li);

      document.getElementById("task").value = "";
    }

    function markDone(checkbox) {

      let text = checkbox.nextElementSibling;

      if (checkbox.checked) {
        text.classList.add("done");
      } else {
        text.classList.remove("done");
      }
    }

    function deleteTask(button) {
      button.parentElement.remove();
    }
  </script>

</body>
</html>
