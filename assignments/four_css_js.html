<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pull-Down Menu & List Box</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e0f7ff, #b3e5fc, #81d4fa);
        text-align: center;
        padding: 50px;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        width: 420px;
        margin: auto;
        box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    }

    h1 {
        color: #0277bd;
        margin-bottom: 20px;
    }

    label {
        font-weight: bold;
        display: block;
        margin-top: 15px;
    }

    select {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    button {
        margin-top: 20px;
        background-color: #0288d1;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background-color: #01579b;
    }

    p {
        margin-top: 15px;
        font-weight: bold;
        color: #333;
    }
    .home {
    display: inline-block;
    padding: 12px 25px;
    background: linear-gradient(135deg, #42a5f5, #1e88e5);
    color: white;
    text-decoration: none;
    border-radius: 25px;
    transition: 0.3s;
}

.home:hover {
    background: linear-gradient(135deg, #1e88e5, #1565c0);
    transform: scale(1.05);
}
</style>

</head>

<body>

<div class="container">
    <h1>Menu & List Box Demo</h1>

    <!-- Pull-Down Menu -->
    <label>Select your Branch:</label>
    <select id="branchMenu">
        <option value="">--Choose Branch--</option>
        <option value="CSE">Computer Science</option>
        <option value="ECE">Electronics</option>
        <option value="ME">Mechanical</option>
        <option value="CE">Civil</option>
    </select>

    <p id="branchResult"></p>

    <!-- List Box -->
    <label>Select your Skills:</label>
    <select id="skillsList" multiple size="5">
        <option value="Java">Java</option>
        <option value="Python">Python</option>
        <option value="HTML">HTML</option>
        <option value="CSS">CSS</option>
        <option value="JavaScript">JavaScript</option>
    </select>

    <button onclick="showSkills()">Show Selected Skills</button>

    <p id="skillsResult"></p>
</div>

<script>
    // Event Listener for Pull-Down Menu
    document.getElementById("branchMenu").addEventListener("change", function() {
        let branch = this.value;

        if (branch === "") {
            document.getElementById("branchResult").innerText = "Please select a branch.";
        } else {
            document.getElementById("branchResult").innerText = "You selected: " + branch;
        }
    });

    // Event Handler for List Box
    function showSkills() {
        let list = document.getElementById("skillsList");
        let selected = [];

        for (let i = 0; i < list.options.length; i++) {
            if (list.options[i].selected) {
                selected.push(list.options[i].value);
            }
        }

        if (selected.length === 0) {
            document.getElementById("skillsResult").innerText = "No skills selected.";
        } else {
            document.getElementById("skillsResult").innerText =
                "Selected Skills: " + selected.join(", ");
        }
    }
</script>
    <a href="https://saheema919-svg.github.io/sem4-fet" class="home">Visit My Homepage</a>

</body>
</html>
