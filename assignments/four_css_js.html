<!DOCTYPE html>
<html>
<head>
<style>
  body{
    margin:0;
    height:45vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
   
  }
  .container {
    position: relative;
    height: 200px;
    margin-top: 20px;
  }

  .box {
    width: 100px;
    height: 100px;
    position: absolute;
    border: 2px solid black;
    border-radius: 10px;
    transition: all 0.3s ease;
    /* Initial stack order */
    z-index: 1;
  }

  #red { background-color: #ff4d4d; top: 0; left: 0; }
  #blue { background-color: #4d94ff; top: 0; left: 0; }
  #green { background-color: #4CAF50; top: 0; left: 0; }

  button {
    padding: 10px 15px;
    margin-right: 5px;
    cursor: pointer;
    font-weight: bold;
  }
</style>
</head>
<body>

<h2>Layer Controller</h2>

<button onclick="bringToFront('red')">Red to Front</button>
<button onclick="bringToFront('blue')">Blue to Front</button>
<button onclick="bringToFront('green')">Green to Front</button>

<div class="container">
  <div id="red" class="box"></div>
  <div id="blue" class="box"></div>
  <div id="green" class="box"></div>
</div>

<script>
  let topLayer = 10;
  function bringToFront(id) {
    const targetBox = document.getElementById(id);
    topLayer++;
    targetBox.style.zIndex = topLayer;
  }
</script>
</body>
</html>
