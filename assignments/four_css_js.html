<!DOCTYPE html>
<html>
<head>
    <title>Menus and List Box</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        select:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102,126,234,0.5);
        }

        .output {
            margin-top: 15px;
            padding: 12px;
            background: #f1f3f6;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        /* Animation class */
        .show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Course Selection</h2>

    <label>Choose Course</label>
    <select id="course">
        <option value="">-- Select --</option>
        <option value="CSE">Computer Science</option>
        <option value="ECE">Electronics</option>
        <option value="ME">Mechanical</option>
    </select>

    <label>Select Subjects</label>
    <select id="subjects" multiple size="4">
        <option value="Maths">Maths</option>
        <option value="Physics">Physics</option>
        <option value="Programming">Programming</option>
        <option value="Electronics">Electronics</option>
    </select>

    <div class="output" id="result">
        Selected values will appear here
    </div>

</div>

<script>
let course = document.getElementById("course");
let subjects = document.getElementById("subjects");
let result = document.getElementById("result");

// Event listeners
course.addEventListener("change", display);
subjects.addEventListener("change", display);

function display() {
    let selectedCourse = course.value;

    let selectedSubjects = [];
    for (let option of subjects.options) {
        if (option.selected) {
            selectedSubjects.push(option.value);
        }
    }

    result.innerHTML =
        "<b>Course:</b> " + (selectedCourse || "None") +
        "<br><b>Subjects:</b> " + (selectedSubjects.length ? selectedSubjects.join(", ") : "None");

    // Restart animation
    result.classList.remove("show");
    void result.offsetWidth; // force reflow
    result.classList.add("show");
}
</script>

</body>
</html>
