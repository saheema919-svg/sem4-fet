<!DOCTYPE html>
<html>
<head>
<style>

body{
    margin:0;
    font-family:Arial;
    text-align:center;
    background:linear-gradient(135deg,#e0f7ff,#b3e5fc,#81d4fa);
}

h2{
    margin-top:20px;
}

.buttons{
    margin:20px;
}

button{
    padding:10px 18px;
    margin:5px;
    border:none;
    border-radius:8px;
    background:#1e88e5;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1565c0;
    transform:scale(1.05);
}

.container{
    position:relative;
    width:300px;
    height:300px;
    margin:40px auto;
}

/* Fully Overlapped Boxes */
.box{
    width:200px;
    height:200px;
    position:absolute;
    top:50px;
    left:50px;
    border-radius:15px;
    color:white;
    font-size:28px;
    font-weight:bold;
    line-height:200px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
    transition:0.3s;
}

/* Initial Stack Order */
#red{
    background:red;
    z-index:1;
}

#blue{
    background:blue;
    z-index:2;
}

#green{
    background:green;
    z-index:3;
}

.box:hover{
    transform:scale(1.03);
}

.home{
    display:inline-block;
    padding:12px 25px;
    background:linear-gradient(135deg,#42a5f5,#1e88e5);
    color:white;
    text-decoration:none;
    border-radius:25px;
    transition:0.3s;
}

.home:hover{
    background:linear-gradient(135deg,#1e88e5,#1565c0);
    transform:scale(1.05);
}

</style>
</head>

<body>

<h2>Fully Overlapping z-index Boxes</h2>

<div class="buttons">
    <button onclick="bringToFront('red')">Red to Front</button>
    <button onclick="bringToFront('blue')">Blue to Front</button>
    <button onclick="bringToFront('green')">Green to Front</button>
</div>

<div class="container">

    <div id="red" class="box">RED</div>

    <div id="blue" class="box">BLUE</div>

    <div id="green" class="box">GREEN</div>

</div>

<a href="https://saheema919-svg.github.io/sem4-fet" class="home">
Visit My Homepage
</a>

<script>

let topLayer = 10;

function bringToFront(id){

    let box = document.getElementById(id);

    topLayer++;

    box.style.zIndex = topLayer;
}

</script>

</body>
</html>
